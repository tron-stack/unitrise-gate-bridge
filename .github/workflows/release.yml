# Release: push a tag like v0.4.0 and this builds every platform, runs the
# tests, and publishes a GitHub Release whose asset URLs match EXACTLY what
# the backend serves (unitrise-gate-<platform>[.exe] + SHA256SUMS + the
# Windows install scripts).
#
# After the release is live, point the backend at it (Render env):
#   GATE_BRIDGE_DOWNLOAD_BASE=https://github.com/tron-stack/unitrise-gate-bridge/releases/latest/download
#   GATE_AGENT_LATEST_VERSION=<the version you tagged, no leading v>
# The "latest/download" base serves the installer links. Self-updates come
# from the VERSIONED folder (.../releases/download/v<version>/), the only
# place the agent accepts them from.
#
# RELEASE SIGNATURE: agents install a self-update only when SHA256SUMS.sig
# verifies against the public key compiled into them (release-signing.pub,
# committed). The private key is the repository secret RELEASE_SIGNING_KEY
# (its file content: 64 hex characters, or an OpenSSL Ed25519 PEM key). Once
# release-signing.pub is committed, a release without the secret FAILS here
# rather than shipping a release no agent will install.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet + tests
        run: make test

      - name: Build all platforms and sign SHA256SUMS (version = tag without the v)
        env:
          RELEASE_SIGNING_KEY_CONTENT: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -f release-signing.pub ] && [ -z "$RELEASE_SIGNING_KEY_CONTENT" ]; then
            echo "release-signing.pub is committed but the RELEASE_SIGNING_KEY secret is not set - agents would refuse this release."
            exit 1
          fi
          if [ -n "$RELEASE_SIGNING_KEY_CONTENT" ]; then
            umask 077
            KEY_FILE="$RUNNER_TEMP/release-signing.key"
            printf '%s\n' "$RELEASE_SIGNING_KEY_CONTENT" > "$KEY_FILE"
            make release VERSION="${GITHUB_REF_NAME#v}" RELEASE_SIGNING_KEY="$KEY_FILE"
            rm -f "$KEY_FILE"
            test -f dist/SHA256SUMS.sig
          else
            make release VERSION="${GITHUB_REF_NAME#v}"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "UnitRise Gate Bridge $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
